# ===================================================================
# CareConnect - Production Configuration (Railway MySQL)
# Profile: application-prod.properties
# ===================================================================

# -------------------------------------------------------------------
# 1. Server Configuration
# -------------------------------------------------------------------
server.port=${PORT:8000}
server.host=${HOST:0.0.0.0}
careconnect.environment=production
careconnect.project-name=CareConnect Cloud API

# -------------------------------------------------------------------
# 2. Railway MySQL DataSource Configuration
# -------------------------------------------------------------------
# Automatically maps Railway's injected environment variables:
# MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD, MYSQL_URL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:containers-us-west-1.railway.app}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Python / SQLAlchemy Database URL format for Railway:
careconnect.database-url=mysql+pymysql://${MYSQLUSER}:${MYSQLPASSWORD}@${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?charset=utf8mb4

# -------------------------------------------------------------------
# 3. Hibernate & JPA Settings (MySQL 8.0)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -------------------------------------------------------------------
# 4. HikariCP Production Connection Pool (Cloud Resilient)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=CareConnectRailwayHikariPool

# -------------------------------------------------------------------
# 5. Security & JWT Configuration
# -------------------------------------------------------------------
careconnect.jwt.secret=${SECRET_KEY:careconnect_secret_key_production_secure_32bytes_minimum}
careconnect.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# 6. CORS & Cloud Gateways
# -------------------------------------------------------------------
careconnect.cors.allowed-origins=${CORS_ORIGINS:*}
careconnect.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
careconnect.cors.allowed-headers=*
