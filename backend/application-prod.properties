# CareConnect Production Profile Properties
server.port=${PORT:8000}
server.host=${HOST:0.0.0.0}
careconnect.project-name=${PROJECT_NAME:CareConnect Cloud API}
careconnect.environment=production
careconnect.database-url=${DATABASE_URL:mysql+pymysql://user:pass@host:3306/careconnect_db}
careconnect.secret-key=${SECRET_KEY:careconnect_secret_key_production_secure_32bytes_minimum}
careconnect.cors-origins=${CORS_ORIGINS:*}
