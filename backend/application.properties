# ===================================================================
# CareConnect - Base Application Configuration
# Profile: application.properties
# ===================================================================

# Active Spring Profile (Set to 'prod' for Railway / Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server Configuration
server.port=${PORT:8000}
server.host=${HOST:0.0.0.0}

# Railway MySQL DataSource (Fallback to local MySQL or SQLite)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:careconnect_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Security
careconnect.jwt.secret=${SECRET_KEY:careconnect_secret_key_production_secure_32bytes_minimum}
careconnect.cors.allowed-origins=${CORS_ORIGINS:*}
