name: CareConnect CI/CD Pipeline

on:
  push:
    branches: [ main, master, asish-kumar ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # 1. Backend CI (FastAPI, SQLite, MySQL Drivers, Tests)
  # ----------------------------------------------------
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run Backend Integration & Health Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./careconnect_test.db
          SECRET_KEY: ci_test_secret_key_production_secure_32bytes_min
          CORS_ORIGINS: "*"
        run: |
          python test_api.py
          python test_portfolio_api.py

  # ----------------------------------------------------
  # 2. Frontend CI (React 19, Vite Build, PWA Generation)
  # ----------------------------------------------------
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React 19 PWA Production Bundle
        env:
          VITE_API_BASE_URL: https://careconnect-backend.onrender.com
          VITE_AI_URL: https://careconnect-backend.onrender.com
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careconnect-web-dist
          path: frontend/dist/
          retention-days: 7

  # ----------------------------------------------------
  # 3. Mobile Build (Flutter APK Release Generation)
  # ----------------------------------------------------
  mobile-build:
    name: Flutter Mobile Build (APK Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Mobile APK
        run: |
          if [ -d "mobile" ]; then
            cd mobile
            flutter pub get
            flutter analyze
            flutter build apk --release
          elif [ -d "../CareConnect-Flutter" ]; then
            cd ../CareConnect-Flutter
            flutter pub get
            flutter analyze
            flutter build apk --release
          fi

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: careconnect-mobile-release-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            ../CareConnect-Flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ----------------------------------------------------
  # 4. Automated Cloud Deploy Trigger (Render Webhook)
  # ----------------------------------------------------
  deploy-render:
    name: Trigger Render Cloud Deployment
    needs: [ backend-test, frontend-build ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered successfully."
